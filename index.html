  async function chatCall(messages, signal, maxTokens, temp, vision) {
    const res = await wfetch(GROQ_URL, {
      method: 'POST',
      signal,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(vision ? { messages } : { model: GROQ_MODEL, messages, temperature: temp, max_tokens: maxTokens })   // visão: JSON padrão só com messages, sempre para /chat
    });
    if (!res.ok) { const e = new Error('http'); e.status = res.status; throw e; }
    const data = await res.json();
    const msg = data.choices && data.choices[0] && data.choices[0].message;
    return ((msg && msg.content) || '').trim();
  }

  function parseReply(raw) {
    const tags = (raw.match(/\[[A-Za-z0-9]+\]/g) || []).map(x => x.slice(1, -1).toLowerCase());
    const face = tags.find(x => EMO_LIST.includes(x)) || 'idle';
    const act = tags.find(x => MODE_LIST.includes(x)) || null;   // tag de modo (removida do texto abaixo)
    const clean = raw.replace(/\[(?:weather|search|vision)[^\]]*\]?/gi, '').replace(/\[[A-Za-zÀ-ÿ0-9_]+\]/g, '').replace(/[*_#`]/g, '').replace(/\s+/g, ' ').trim();
    return { face, text: clean, act };
  }

  async function fetchWeather(city, signal) {
    const res = await wfetch(WEATHER_URL + '?city=' + encodeURIComponent(city), { signal });
    if (!res.ok) { const e = new Error('http'); e.status = res.status; throw e; }
    const d = await res.json();
    const cur = d && d.current;
    if (!cur || typeof cur.temperature_2m !== 'number') throw new Error('sem dados de clima');
    let loc = d.location;
    if (loc && typeof loc === 'object') loc = loc.name || loc.city || '';
    loc = (typeof loc === 'string' && loc.trim()) ? loc.trim() : city;
    lastWeatherData = { loc, temp: cur.temperature_2m, rain: typeof cur.precipitation_probability === 'number' ? cur.precipitation_probability : null, code: typeof cur.weather_code === 'number' ? cur.weather_code : null, precip: typeof cur.precipitation === 'number' ? cur.precipitation : 0 };
    return lastWeatherData;
  }

  async function fetchSearch(term, signal) {
    const res = await wfetch(SEARCH_URL + '?q=' + encodeURIComponent(term), { signal });
    if (!res.ok) { const e = new Error('http'); e.status = res.status; throw e; }
    const body = await res.text();
    let out = body;
    try {
      const d = JSON.parse(body);
      const arr = Array.isArray(d) ? d : (d.results || d.items || d.organic || d.data || null);
      if (Array.isArray(arr)) out = arr.slice(0, 5).map((x, i) => (i + 1) + '. ' + [x.title, x.snippet || x.description || x.content || x.text].filter(Boolean).join(' - ')).join('\n');
      else if (typeof d === 'string') out = d;
      else if (d.answer || d.summary) out = String(d.answer || d.summary);
      else out = JSON.stringify(d);
    } catch (e) {}
    out = String(out).replace(/\s+/g, ' ').trim().slice(0, 1800);
    if (!out) throw new Error('sem resultados');
    return out;
  }

  async function askGroq(text) {
    const c = new AbortController();
    ctl = c;
    let timedOut = false, to = 0;
    const arm = ms => { clearTimeout(to); to = setTimeout(() => { timedOut = true; c.abort(); }, ms); };
    arm(15000);
    try {
      sarcLocal = false;
      const ls = detectSarcasm(text);
      if (ls !== null) { setSarcasm(ls); sarcLocal = true; }   // vale já neste prompt
      themeLocal = false;
      const th = detectTheme(text);
      if (th) { themeLocal = true; handleThemeTag(th); }   // vale já neste prompt; a tag da IA é ignorada
      const cm = detectCommunist(text);
      if (cm) setCommunist(cm === 'on');                         // modo comunista por voz (vale já neste prompt)
      let image = null, usedImage = false;
      const nt = normTxt(text);
      const facing = FRONT_RE.test(nt) ? 'user' : (BACK_RE.test(nt) ? 'environment' : null);   // 'olha pra mim', 'selfie'... força a frontal
      if (facing || VISION_RE.test(nt)) {   // gatilho por palavra-chave: captura ANTES de chamar /chat
        image = await captureRearCameraFrame(facing);
        if (c.signal.aborted) throw new Error('abort');
        if (!image) { const r0 = { face: 'crying', text: 'Não consegui abrir a câmera. Libere a permissão do site no Chrome e tente de novo.' }; return r0; }
        usedImage = true;
        arm(20000);
      }
      const userMsg = img => img ? { role: 'user', content: [{ type: 'text', text }, { type: 'image_url', image_url: { url: img } }] } : { role: 'user', content: text };
      let raw = takeSaves(await chatCall([{ role: 'system', content: buildSystem(false, !!image) }, ...history, userMsg(image)], c.signal, 400, 0.8, !!image));
      let reply = parseReply(raw);

      if (!image && /\[vision\]/i.test(raw)) {   // tag da IA: captura o frame e reenvia a pergunta com a imagem
        image = await captureRearCameraFrame(facing);
        if (c.signal.aborted) throw new Error('abort');
        if (!image) return { face: 'crying', text: 'Não consegui abrir a câmera. Libere a permissão do site no Chrome e tente de novo.' };
        usedImage = true;
        arm(20000);
        raw = takeSaves(await chatCall([{ role: 'system', content: buildSystem(false, true) }, ...history, userMsg(image)], c.signal, 400, 0.8, true));
        reply = parseReply(raw);
      }
      if (usedImage) setTimeout(() => { if (phase === 'thinking') setMode('thinking'); }, 600);

      const sm = raw.match(/\[search:\s*([^\]\n]*)/i);
      if (sm && !image) {   // pesquisa na web em tempo real
        const term = sm[1].replace(/\s+/g, ' ').trim() || text;
        arm(20000);
        let found = null;
        try { found = await fetchSearch(term, c.signal); } catch (e) { if (c.signal.aborted) throw e; }
        if (found) {
          const tone = lockedMode === 'gamer' ? 'calma, tranquila e bem-humorada' : lockedMode === 'focus' ? 'direta e objetiva' : 'curta, natural e bem-humorada';
          reply = { face: 'smirk', text: '' };
          const raw2 = takeSaves(await chatCall([
            { role: 'system', content: buildSystem(true, true) }, ...history,
            { role: 'user', content: 'Resultados reais da pesquisa na web para "' + term + '": ' + found + '. O usuário perguntou: "' + text + '". ' +
              'Responda em no máximo duas frases curtas, ' + tone + ', usando só o que os resultados dizem, começando com uma tag de emoção (nunca [search]) e sem links, sem markdown.' }
          ], c.signal, 220, 0.8));
          reply = parseReply(raw2);
          raw = raw2.replace(/\[(?:weather|search|vision)[^\]]*\]?/gi, '');
        } else {
          reply = { face: 'crying', text: 'Tentei pesquisar sobre ' + term + ', mas a internet me deixou no vácuo.' };
          raw = '[crying] ' + reply.text;
        }
      }

      const wm = raw.match(/\[weather(?::\s*([^\]]*))?\]/i);
      if (wm) {
        const city = (wm[1] || '').replace(/\s+/g, ' ').trim() || 'Luziânia';
        arm(20000);
        let wx = null;
        try { wx = await fetchWeather(city, c.signal); } catch (e) { if (c.signal.aborted) throw e; }
        reply = { face: 'crying', text: '' };
        if (wx) {
          const t = Math.round(wx.temp);
          const tone = lockedMode === 'gamer' ? 'calma, tranquila e bem-humorada' : lockedMode === 'focus' ? 'direta e objetiva' : 'sarcástica';
          const dados = 'local ' + wx.loc + ', temperatura ' + t + ' graus' + (wx.rain !== null ? ', chance de chuva ' + Math.round(wx.rain) + ' por cento' : '');
          reply = { face: 'smirk', text: 'Em ' + wx.loc + ' faz ' + t + ' graus' + (wx.rain !== null ? ' e ' + Math.round(wx.rain) + '% de chance de chuva' : '') + '. Pronto, virei meteorologista.' };
          raw = '[smirk] ' + reply.text;
          try {
            const raw2 = takeSaves(await chatCall([
              { role: 'system', content: buildSystem(true, true) }, ...history,
              { role: 'user', content: 'Dados reais do clima agora (fonte: serviço meteorológico): ' + dados + '. O usuário perguntou: "' + text + '". ' +
                'Responda com uma única frase curta, ' + tone + ', comentando esses números reais e citando o local, começando com uma tag de emoção (nunca [weather]) e escrevendo os números por extenso ou como "graus", sem o símbolo °C.' }
            ], c.signal, 150, 0.9));
            const r2 = parseReply(raw2);
            if (r2.text) { reply = r2; raw = raw2.replace(/\[weather[^\]]*\]/gi, ''); }
          } catch (e) { if (c.signal.aborted) throw e; }
        } else {
          reply = { face: 'crying', text: 'Não consegui espiar o céu de ' + city + ' agora. Olhe pela janela, é de graça.' };
          raw = '[crying] ' + reply.text;
        }
      }

      if (!reply.text && reply.act) reply.text = 'Feito.';
      if (!reply.text) throw new Error('empty');
      history.push({ role: 'user', content: (usedImage ? '[Imagem capturada] ' : '') + text }, { role: 'assistant', content: raw.replace(/\[(?:weather|search|vision)[^\]]*\]?/gi, '') });
      if (history.length > 8) history.splice(0, history.length - 8);
      return reply;
    } catch (err) {
      if (timedOut) { const e = new Error('timeout'); e.timeout = true; throw e; }
      throw err;
    } finally {
      clearTimeout(to);
      if (ctl === c) ctl = null;
    }
  }

  function errorMessage(err) {
    if (err.status === 401 || err.status === 403) return 'Chave da API inválida ou sem permissão.';
    if (err.status === 429) return 'Limite de uso da API atingido. Tente de novo em instantes.';
    if (err.status) return 'Erro da API (' + err.status + ').';
    if (err.timeout) return 'A IA demorou demais para responder.';
    if (err.name === 'TypeError') return 'Sem conexão com a internet.';
    return 'Não consegui falar com a IA.';
  }

    nextShake = Date.now() + 8000;
    if (isSleeping) return;
    shakeUntil = Date.now() + 2000;
    clearTimeout(shakeTimer);
    shakeTimer = setTimeout(() => { shakeUntil = 0; settleFace(); }, 2000);
    if (phase !== 'listening' && phase !== 'thinking' && phase !== 'manual') setMode('glitch');
    playGlitchSound();
    trySpeak({ face: 'idle', text: sayLine('shake') });
  }
  try {
    window.addEventListener('devicemotion', e => {
      const a = e.accelerationIncludingGravity;
      if (!a || a.x == null) return;
      if (lastAcc && Date.now() >= nextShake && Math.hypot(a.x - lastAcc.x, a.y - lastAcc.y, a.z - lastAcc.z) > 18) onShake();
      lastAcc = { x: a.x, y: a.y, z: a.z };
    }, true);
  } catch (e) {}

  function updBat(b) {
    batInfo = { pct: Math.round(b.level * 100), chg: !!b.charging };
    batLow = b.level <= 0.20 && !b.charging;   // brilho dos olhos pela metade até ligar o carregador
    if (batLow && !batWarned) {
      batWarned = true;   // aviso único na sessão
      const reply = { face: 'crying', text: sayLine('bat', batInfo.pct) };
      if (!trySpeak(reply)) notify(reply.text, 6000);
    }
    renderHud();
  }
  try {
    if (navigator.getBattery) navigator.getBattery().then(b => {
      updBat(b);
      b.addEventListener('levelchange', () => updBat(b));
      b.addEventListener('chargingchange', () => updBat(b));
    }).catch(() => {});
  } catch (e) {}

  fetchWeather('Luziânia').catch(() => {});   // clima local silencioso para o fundo do visor
  setInterval(() => { if (!document.hidden) fetchWeather('Luziânia').catch(() => {}); }, 1800000);
  triggerGrumpyWakeUp();   // abriu/recarregou a página: 3 s de mau humor (a fala sai no primeiro toque)

  requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
})();
</script>
