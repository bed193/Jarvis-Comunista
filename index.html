<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>Jarvis</title>
<style>
  :root{--ac:224,36,168;--hudc:0,240,255}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:manipulation;overscroll-behavior:none;font-family:system-ui,-apple-system,Roboto,sans-serif;color:#fff}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block;background:#000}
  #notice{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);max-width:90%;padding:8px 14px;border-radius:999px;background:rgba(168,85,247,.14);border:1px solid rgba(168,85,247,.35);font-size:13px;line-height:1.35;color:#d8b4fe;text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
  #notice.show{opacity:1}
  #caption{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 110px);padding:0 24px;min-height:18px;text-align:center;font-size:14px;color:rgba(216,180,254,.5);pointer-events:none}
  #bar{position:fixed;left:0;right:0;bottom:0;display:flex;flex-wrap:nowrap;overflow-x:auto;justify-content:safe center;gap:8px;scrollbar-width:none;padding:10px 12px calc(env(safe-area-inset-bottom,0px) + 12px)}
  #bar::-webkit-scrollbar{display:none}
  #bar button{flex:none;white-space:nowrap;font:inherit;font-size:12px;padding:8px 12px;border-radius:999px;border:1px solid rgba(var(--ac),.3);background:rgba(255,255,255,.05);color:rgba(255,160,230,.65);cursor:pointer}
  #bar button.on{background:rgba(var(--ac),.3);color:#fff}
  #memBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 78px);left:8px;font:inherit;font-size:10px;padding:5px 9px;border-radius:999px;border:1px solid rgba(var(--ac),.22);background:transparent;color:rgba(255,160,230,.4);opacity:.55;cursor:pointer}
  #memBtn:active{opacity:1}
  #crt{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 52%,rgba(0,0,0,.72) 100%),repeating-linear-gradient(to bottom,rgba(var(--hudc),.05) 0 1px,rgba(0,0,0,0) 1px 3px),repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 2px,rgba(0,0,0,.22) 2px 3px)}
  .hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);font:10px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;color:rgba(var(--hudc),.62);text-shadow:0 0 6px rgba(var(--hudc),.45);pointer-events:none;white-space:pre}
  #hudL{left:12px}
  #hudR{right:12px;text-align:right}
  .hud .warn{color:rgba(250,204,21,.9)}
  .hud .bad{color:rgba(255,30,86,.95)}
  .hud .tm{color:rgba(57,255,20,.9)}
  @keyframes hudflash{50%{opacity:.1}}
  .hud.flash{animation:hudflash .3s 6}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50;transition:opacity .5s ease-out}
  #flash.snap{opacity:.92;transition:none}
  #camBtn,#tasksBtn{position:fixed;left:6px;width:104px;height:18px;padding:0;border:0;background:transparent;opacity:0;cursor:pointer;z-index:5}
  #camBtn{top:calc(env(safe-area-inset-top,0px) + 39px)}
  #tasksBtn{top:calc(env(safe-area-inset-top,0px) + 54px)}
  #actBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 72px);display:none;z-index:40;font:inherit;font-size:13px;padding:10px 16px;border-radius:999px;border:1px solid rgba(var(--hudc),.6);background:rgba(0,20,30,.88);color:#7ff;cursor:pointer}
  #actBtn.on{display:block}
  #tasksModal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:60}
  #tasksModal.open{display:flex}
  #tasksModal .card{min-width:260px;max-width:88vw;max-height:70vh;overflow:auto;padding:14px 16px;border:1px solid rgba(var(--hudc),.4);border-radius:10px;background:#05070d;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:rgba(var(--hudc),.88)}
  #tasksModal .ttl{letter-spacing:.12em;margin-bottom:8px;color:rgba(250,204,21,.9)}
  #tasksModal ul{list-style:none;margin:0;padding:0}
  #tasksModal li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(var(--hudc),.15)}
  #tasksModal button{font:inherit;font-size:12px;padding:5px 10px;border-radius:999px;border:1px solid rgba(var(--hudc),.4);background:transparent;color:rgba(var(--hudc),.85);cursor:pointer}
  #tasksModal .foot{margin-top:10px;text-align:right}
  #sarcBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 24px);right:6px;width:104px;height:18px;padding:0;border:0;background:transparent;opacity:0;cursor:pointer;z-index:5}
  #themeBtn{position:fixed;top:calc(env(safe-area-inset-top,0px) + 44px);left:50%;transform:translateX(-50%);font:10px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.08em;padding:4px 10px;border-radius:999px;border:1px solid rgba(var(--ac),.3);background:transparent;color:rgba(var(--ac),.75);opacity:.6;cursor:pointer;z-index:5;white-space:nowrap}
  #themeBtn:active{opacity:1}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crt"></div>
<div class="hud" id="hudL"></div>
<div class="hud" id="hudR"></div>
<div id="notice"></div>
<div id="flash"></div>
<video id="camVideo" autoplay playsinline muted style="display:none"></video>
<canvas id="camCanvas" style="display:none"></canvas>
<button id="memBtn" type="button" title="Apagar as memórias permanentes do Jarvis">limpar memória</button>
<button id="sarcBtn" type="button" aria-label="Nível de sarcasmo"></button>
<button id="themeBtn" type="button">TEMA 1: PUNK</button>
<button id="camBtn" type="button" aria-label="Alternar câmera padrão"></button>
<button id="tasksBtn" type="button" aria-label="Ver tarefas"></button>
<button id="actBtn" type="button"></button>
<div id="tasksModal"><div class="card"><div class="ttl">TAREFAS PENDENTES</div><ul id="tasksList"></ul><div class="foot"><button id="tasksClose" type="button">fechar</button></div></div></div>
<div id="caption">Toque na tela para falar</div>
<div id="bar"></div>

<script>
/* Modo fixo atual: null = normal | 'gamer' | 'focus' | 'dance'. Só volta ao normal com [normal] ou pedido do usuário. */
let lockedMode = null;
/* Camada temática liga/desliga: começa sempre desativada; não trava as expressões. */
let isCommunist = false;

(() => {
  'use strict';

  const player = new Audio();   // instância única, destravada no primeiro toque (Chrome Android)
  player.crossOrigin = 'anonymous';

  /* ---------- Web Audio: analisador da voz + bipes cyber ---------- */
  let actx = null, analyser = null, abuf = null, live = false, lvl = 0;
  const WN = 72, wv = new Float32Array(WN);   // pontos da onda sonora do HUD

  function initAudio() {
    if (actx) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      try {
        const an = actx.createAnalyser();
        an.fftSize = 512;
        an.smoothingTimeConstant = .35;
        const src = actx.createMediaElementSource(player);   // só pode ser criado uma vez por elemento
        src.connect(an);
        an.connect(actx.destination);
        abuf = new Uint8Array(an.fftSize);
        analyser = an;
      } catch (e) { analyser = null; }
    } catch (e) { actx = null; analyser = null; }
  }

  function playBeepSeq() {   // 3 bipes cyber quando o timer termina
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      const base = actx.currentTime;
      for (let i = 0; i < 3; i++) {
        const t0 = base + i * .24;
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(660, t0);
        o.frequency.exponentialRampToValueAtTime(990, t0 + .1);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.12, t0 + .012);
        g.gain.linearRampToValueAtTime(0.0001, t0 + .14);
        o.connect(g);
        g.connect(actx.destination);
        o.start(t0);
        o.stop(t0 + .16);
      }
    } catch (e) {}
  }

  function playBeep(type) {
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      const up = type === 'listen';
      const f0 = up ? 440 : 660, f1 = up ? 880 : 330, dur = up ? .09 : .11;
      const t0 = actx.currentTime;
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = up ? 'square' : 'sine';
      o.frequency.setValueAtTime(f0, t0);
      o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.08, t0 + .012);
      g.gain.linearRampToValueAtTime(0.0001, t0 + dur + .02);
      o.connect(g);
      g.connect(actx.destination);
      o.start(t0);
      o.stop(t0 + dur + .04);
    } catch (e) {}
  }

  function playWakeSound() {   // som cyber ascendente ao acordar: 330Hz -> 550Hz -> 880Hz
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      const base = actx.currentTime + .02;
      [330, 550, 880].forEach((f, i) => {
        const t0 = base + i * .13, end = i === 2 ? .3 : .12;
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = 'square';
        o.frequency.setValueAtTime(f * .96, t0);
        o.frequency.exponentialRampToValueAtTime(f, t0 + .05);
        g.gain.setValueAtTime(0.0001, t0);
        g.gain.linearRampToValueAtTime(0.09, t0 + .012);
        g.gain.linearRampToValueAtTime(0.0001, t0 + end);
        o.connect(g);
        g.connect(actx.destination);
        o.start(t0);
        o.stop(t0 + end + .03);
      });
    } catch (e) {}
  }

  function playGlitchSound() {   // interferência curta (OscillatorNode serra com frequência saltando)
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      const t0 = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sawtooth';
      for (let i = 0; i < 14; i++) o.frequency.setValueAtTime(150 + Math.random() * 1800, t0 + i * .025);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.linearRampToValueAtTime(0.09, t0 + .01);
      g.gain.linearRampToValueAtTime(0.0001, t0 + .36);
      o.connect(g); g.connect(actx.destination);
      o.start(t0); o.stop(t0 + .38);
    } catch (e) {}
  }

  function playAnimeSound(kind) {   // som de ativação dos modos de anime (OscillatorNode)
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      const t0 = actx.currentTime + .02;
      const tone = (type, f0, f1, t, dur, vol, dest) => {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + Math.min(.04, dur / 3)); g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(dest || actx.destination); o.start(t); o.stop(t + dur + .03);
      };
      if (kind === 'banguela') { tone('sawtooth', 48, 190, t0, 1, .1); tone('sine', 96, 380, t0, 1, .13); tone('triangle', 52, 210, t0 + .05, .95, .08); }   // carga de plasma
      else if (kind === 'gear5') { [[0, 1], [.18, 1], [.38, 0], [.5, 0]].forEach(([d, k]) => k ? tone('sine', 150, 45, t0 + d, .16, .35) : tone('square', 520, 380, t0 + d, .07, .09)); }   // tum-tum-ta-ta
      else if (kind === 'asta') {   // impacto grave distorcido
        const ws = actx.createWaveShaper(), cur = new Float32Array(256);
        for (let i = 0; i < 256; i++) cur[i] = Math.tanh((i / 128 - 1) * 6);
        ws.curve = cur; ws.connect(actx.destination);
        tone('sawtooth', 90, 32, t0, .7, .2, ws); tone('square', 60, 28, t0, .6, .12, ws);
      }
    } catch (e) {}
  }

  /* ---------- Canvas ---------- */
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const off = document.createElement('canvas');
  const oc = off.getContext('2d');
  let W = 0, H = 0, dpr = 1;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    W = window.innerWidth; H = window.innerHeight;
    for (const c of [cv, off]) { c.width = Math.round(W * dpr); c.height = Math.round(H * dpr); }
  }
  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', () => setTimeout(resize, 150));
  resize();

  /* ---------- Estados e emoções ---------- */
  const DEF = { sx: 1, sy: 1, dy: 0, lidL: 0, lidR: 0, hapL: 0, hapR: 0, angL: 0, angR: 0, spark: 0, fury: 0, horns: 0, tears: 0, xx: 0, joint: 0, ring: 0, slp: 0, rain: 0, dance: 0, glow: 0, ban: 0, g5: 0, ast: 0, slit: 0, c: '#E024A8' };
  const MODES = {
    idle:      { sy: .82, lidL: .18, lidR: .18, spark: 1 },
    listening: { sx: 1.12, sy: 1.15, spark: .6, c: '#FF4FD8' },
    thinking:  { sy: .6, dy: .12, lidL: .38, lidR: .38, c: '#8B5CF6' },
    smirk:     { sy: .95, hapL: .6, lidR: .45, angR: .25, spark: 1, c: '#39FF14' },
    wink:      { hapL: .9, lidL: .45, c: '#00F0FF' },
    angry:     { sx: 1.04, angL: 1, angR: 1, fury: 1, c: '#FF1E56' },
    surprised: { sx: .9, sy: 1.45, c: '#FACC15' },
    evil:      { sy: .9, angL: .95, angR: .95, hapL: .25, hapR: .25, horns: 1, c: '#FF007F' },
    crying:    { sy: .95, lidL: .1, lidR: .1, tears: 1, c: '#5B8CFF' },
    dead:      { xx: 1, c: '#9C2A7A' },
    glitch:    { sx: 1.02, c: '#FF2BD6' },
    gamer:     { sy: .86, dy: .05, lidL: .48, lidR: .48, joint: 1, c: '#FF2A2A' },
    focus:     { sy: .8, lidL: .1, lidR: .1, ring: 1, c: '#3B82F6' },
    dance:     { sy: 1.02, spark: 1, dance: 1, c: '#FF00FF' },
    hack:      { sy: .72, lidL: .42, lidR: .42, rain: 1, c: '#00FF41' },
    sleep:     { slp: 1, c: '#4C1D95' },
    banguela:  { sy: .95, ban: 1, c: '#A855F7' },
    gear5:     { sx: 1.05, sy: 1.05, g5: 1, c: '#FFFFFF' },
    asta:      { sy: .8, angL: .75, angR: .75, ast: 1, c: '#EF4444' },
    wake:      { sx: 1.08, sy: 1.38, spark: 1, glow: 1, c: '#F5E9FF' },
    scanning:  { sx: 1.08, sy: 1.08, ring: 1, spark: 1, c: '#00F0FF' },
    happy:     { sy: 1, hapL: .85, hapR: .85, spark: 1, c: '#39FF14' },
    bored:     { sy: .9, lidL: .55, lidR: .55, c: '#8B5CF6' },
    grumpy:    { sy: .7, dy: .05, lidL: .52, lidR: .45, angL: .55, angR: .55, c: '#FF5500' }   // mistura de bored + angry
  };
  const LABELS = [['idle','Idle'],['thinking','Pensando'],['smirk','Deboche'],['wink','Piscada'],['angry','Bravo'],['surprised','Surpreso'],['evil','Malicioso'],['crying','Chorando'],['dead','Morto'],['glitch','Glitch'],['happy','Feliz'],['bored','Entediado']];
  const K = Object.keys(DEF).filter(k => k !== 'c').concat(['r', 'g', 'b']);
  const hex = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));

  /* ---------- Sistema de Armaduras / Temas ---------- */
  const THEMES = ['punk', 'stark', 'edgerunner', 'stealth'];
  const THEME_DEF = {
    punk:       { n: 'PUNK',       a: '#E024A8', b: '#00F0FF', glow: 1 },
    stark:      { n: 'MARK VII',   a: '#FACC15', b: '#EF4444', glow: 1 },
    edgerunner: { n: 'EDGERUNNER', a: '#FCEE09', b: '#39FF14', glow: 1 },
    stealth:    { n: 'STEALTH',    a: '#E2E8F0', b: '#38BDF8', glow: .5 }
  };
  const THEME_KEY = 'jarvis_theme';
  const ANIME = ['banguela', 'gear5', 'asta'];
  let themeId = 'punk', THEME = THEME_DEF.punk;
  try { const sv = localStorage.getItem(THEME_KEY); if (THEMES.includes(sv)) themeId = sv; } catch (e) {}
  function setThemeVisual(id) {
    themeId = id; THEME = THEME_DEF[id];
    const rs = document.documentElement.style;
    rs.setProperty('--ac', hex(THEME.a).join(',')); rs.setProperty('--hudc', hex(THEME.b).join(','));
    const tb = document.getElementById('themeBtn');
    if (tb) tb.textContent = 'TEMA ' + (THEMES.indexOf(id) + 1) + ': ' + THEME.n;
  }
  setThemeVisual(themeId);

  const bar = document.getElementById('bar');
  const buttons = {};
  LABELS.forEach(([m, label]) => {
    const b = document.createElement('button');
    b.textContent = label;
    b.addEventListener('click', e => { e.stopPropagation(); manual(m); });
    bar.appendChild(b);
    buttons[m] = b;
  });

  let isSleeping = false, hackUntil = 0, hackTimer = 0, pendingSleep = false;
  let grumpyUntil = 0, grumpyTimer = 0, pendingGrumpy = null, tapGreeted = false;   // mau humor ao abrir/acordar
  let shakeUntil = 0, shakeTimer = 0, faceDown = false, batLow = false;            // sensores
  let gTx = 0, gTy = 0, gX = 0, gY = 0;                                            // paralaxe do giroscópio (px)
  const grumpyOn = () => Date.now() < grumpyUntil, shakeOn = () => Date.now() < shakeUntil;
  const tbtn = {};   // botões toggle: Chapa, Foco, Discoteca, Hacker, Dormir
  const hackOn = () => Date.now() < hackUntil;
  // cara de repouso: dormindo > hacker (7 s) > modo travado > idle
  function restMode() { return isSleeping ? 'sleep' : (grumpyOn() ? 'grumpy' : (shakeOn() ? 'glitch' : (faceDown ? 'bored' : (hackOn() ? 'hack' : (lockedMode || 'idle'))))); }
  function syncToggles() {
    const st = { gamer: lockedMode === 'gamer', focus: lockedMode === 'focus', dance: lockedMode === 'dance', hack: hackOn(), sleep: isSleeping, comunista: isCommunist, banguela: lockedMode === 'banguela', gear5: lockedMode === 'gear5', asta: lockedMode === 'asta' };
    for (const k in tbtn) tbtn[k].classList.toggle('on', !!st[k]);
  }

  const T = {};
  let mode = 'idle', talking = false, kick = 0;
  function setMode(m) {
    mode = m;
    const d = Object.assign({}, DEF, MODES[m]);
    if (m === 'idle' && !lockedMode) d.c = THEME.a;   // cor base da armadura equipada
    if (ANIME.includes(lockedMode)) {   // modo de anime: sobreposições próprias; expressões fortes mantêm a própria cor
      d.ban = lockedMode === 'banguela' ? 1 : 0; d.g5 = lockedMode === 'gear5' ? 1 : 0; d.ast = lockedMode === 'asta' ? 1 : 0;
      if (!['angry', 'scanning', 'sleep', 'dead', 'glitch', 'grumpy', 'surprised', 'crying', 'evil'].includes(m)) d.c = MODES[lockedMode].c;
      if (d.ban) { const hot = m === 'angry' || m === 'evil'; if (hot) d.c = '#38BDF8'; d.slit = (hot || m === 'scanning') ? 1 : 0; }
    }
    if (isCommunist && m === 'idle') d.c = '#FF1E1E';   // camada comunista: olhos neutros ficam vermelhos
    const [r, g, b] = hex(d.c);
    Object.assign(T, d, { r, g, b });
    for (const k in buttons) buttons[k].classList.toggle('on', k === m);
  }
  setMode('idle');
  const P = { lx: 0, ly: 0 };
  K.forEach(k => { P[k] = T[k]; });

  /* ---------- Animação ---------- */
  const rand = (a, b) => a + Math.random() * (b - a);
  const GPAL = ['#FF007F', '#00F0FF', '#FFFFFF', '#E024A8', '#39FF14', '#FACC15'];
  let last = performance.now();
  let blinkStart = -1, nextBlink = 2.5;
  let idleLook = { x: 0, y: 0 }, looking = false, nextLook = 3;
  let jitV = 0, nextJit = 0, flick = 0, nextCol = 0, gcols = ['#FF007F', '#00F0FF'];
  let saccX = 0, saccY = 0, saccTX = 0, saccTY = 0, saccOn = false, nextSacc = 3;   // sacadas oculares

  function frame(ts) {
    const t = ts / 1000;
    const dt = Math.min(.05, (ts - last) / 1000);
    last = ts;

    let blink = 0;
    if (blinkStart < 0 && t > nextBlink) blinkStart = t;
    if (blinkStart >= 0) {
      const p = (t - blinkStart) / (mode === 'grumpy' ? .65 : .18);
      if (p >= 1) { blinkStart = -1; nextBlink = t + (mode === 'grumpy' ? rand(.5, 1) : (Math.random() < .2 ? .12 : rand(2.2, 5.5))); }
      else blink = Math.sin(p * Math.PI);
    }
    if (t > nextLook) {
      if (looking) { idleLook = { x: 0, y: 0 }; looking = false; nextLook = t + rand(2, 4.5); }
      else { idleLook = { x: (Math.random() < .5 ? -1 : 1) * rand(.4, .9), y: rand(-.3, .2) }; looking = true; nextLook = t + rand(.8, 1.6); }
    }

    let lx = 0, ly = 0, pulse = 0, shake = 0, jit = 0, alpha = 1, gl = 0;
    if (mode === 'idle' || mode === 'smirk') { lx = idleLook.x; ly = idleLook.y; }
    else if (mode === 'thinking') { lx = Math.sin(t * 1.9) * .6; ly = -.3 + Math.cos(t * 1.9) * .2; }
    else if (mode === 'listening') pulse = Math.sin(t * 3.2) * .045;
    else if (mode === 'angry') shake = Math.sin(t * 38) * .012;
    else if (mode === 'surprised') pulse = Math.sin(t * 14) * .012;
    else if (mode === 'glitch') {
      gl = 1;
      if (t > nextJit) { jitV = (Math.random() - .5) * .3; nextJit = t + .05; }
      jit = jitV;
      if (t > nextCol) { gcols = [GPAL[(Math.random() * GPAL.length) | 0], GPAL[(Math.random() * GPAL.length) | 0]]; nextCol = t + .09; }
    } else if (mode === 'dead') {
      if (flick > 0) { flick--; gl = .6; jit = (Math.random() - .5) * .2; alpha = Math.random() < .5 ? .25 : 1; }
      else if (Math.random() < .015) flick = 4 + ((Math.random() * 6) | 0);
    }

    let bounce = 0;
    if (mode === 'gamer') { lx = Math.sin(t * .55) * .28; ly = .1; pulse = Math.sin(t * 1.2) * .012; }
    else if (mode === 'focus') { lx = 0; ly = 0; }
    else if (mode === 'dance') {
      const sw = Math.sin(ts * 0.012);                  // ritmo da discoteca
      shake = sw * .24; bounce = -Math.abs(sw) * .1; pulse = Math.abs(sw) * .035;
    } else if (mode === 'hack') {
      gl = .15;
      if (t > nextJit) { jitV = (Math.random() - .5) * .05; nextJit = t + .06; }
      jit = jitV;                                       // tremor sutil
      if (flick > 0) { flick--; gl = .7; jit = (Math.random() - .5) * .16; }
      else if (Math.random() < .025) flick = 3 + ((Math.random() * 4) | 0);
    } else if (mode === 'sleep') pulse = Math.sin(t * 1.1) * .02;
    else if (mode === 'wake') pulse = Math.sin(t * 22) * .012;
    else if (mode === 'scanning') { lx = Math.sin(t * 3.2) * .9; ly = Math.cos(t * 2.1) * .15; pulse = Math.sin(t * 10) * .015; }
    else if (mode === 'happy') { pulse = Math.sin(t * 6) * .02; bounce = -Math.abs(Math.sin(t * 3)) * .04; }
    else if (mode === 'bored') { lx = .35; ly = -.45; }   // olhar para o canto superior
    else if (mode === 'banguela') { lx = Math.sin(t * .8) * .25; ly = Math.cos(t * .6) * .1; pulse = Math.sin(t * 2.2) * .01; }
    else if (mode === 'gear5') { bounce = -Math.abs(Math.sin(ts * .015)) * .06; }
    else if (mode === 'asta') { pulse = Math.sin(t * 5) * .012; shake = Math.sin(t * 27) * .004; }

    kick *= Math.exp(-dt * 6);
    let amp = 0, waveMode = 0;
    if (talking) {
      if (live && analyser) {   // volume real da voz
        try {
          analyser.getByteTimeDomainData(abuf);
          let sum = 0;
          for (let i = 0; i < abuf.length; i++) { const v = (abuf[i] - 128) / 128; sum += v * v; }
          const rms = Math.sqrt(sum / abuf.length);
          lvl += (rms - lvl) * (rms > lvl ? .7 : .25);
          kick = Math.max(kick, Math.min(1, lvl * 4));
          amp = Math.min(1, lvl * 4.5);
          waveMode = 1;
        } catch (e) { live = false; }
      } else {                  // fallback: pulso antigo
        amp = Math.min(1, Math.abs(Math.sin(t * 9.5) * Math.sin(t * 5.1 + 1)) * .8 + kick * .5);
        waveMode = 2;
      }
    } else lvl = 0;

    const k = 1 - Math.exp(-dt * 9);
    K.forEach(key => { P[key] += (T[key] - P[key]) * k; });
    const kl = 1 - Math.exp(-dt * (mode === 'idle' ? 14 : 7));
    P.lx += (lx - P.lx) * kl;
    P.ly += (ly - P.ly) * kl;
    if (mode === 'idle' && !isSleeping) {   // micro-sacadas: a cada 2-5 s o olhar desloca ±8 px por 400 ms
      if (t > nextSacc) {
        if (saccOn) { saccOn = false; saccTX = saccTY = 0; nextSacc = t + rand(2, 5); }
        else { saccOn = true; saccTX = rand(-8, 8); saccTY = rand(-8, 8); nextSacc = t + .4; }
      }
    } else { saccOn = false; saccTX = saccTY = 0; }
    saccX += (saccTX - saccX) * (1 - Math.exp(-dt * 22)); saccY += (saccTY - saccY) * (1 - Math.exp(-dt * 22));
    const kg = 1 - Math.exp(-dt * 6);
    gX += (gTx - gX) * kg; gY += (gTy - gY) * kg;

    draw({
      pulse: pulse + amp * .05, shake, jit, gl, alpha, t, ts, dt, wm: waveMode, amp,
      bob: -amp * .05 + Math.sin(t * 50) * amp * .012 + bounce,
      open: mode === 'sleep' ? 1 : 1 - blink * .95
    });
    requestAnimationFrame(frame);
  }

  function star(c, x, y, r) {
    c.beginPath();
    c.moveTo(x, y - r); c.quadraticCurveTo(x, y, x + r, y);
    c.quadraticCurveTo(x, y, x, y + r); c.quadraticCurveTo(x, y, x - r, y);
    c.quadraticCurveTo(x, y, x, y - r); c.fill();
  }

  function draw(f) {
    const eyeW = Math.min(W * .24, H * .28), eyeH = eyeW * 1.2, gap = eyeW * .7, cyy = H * .46;
    let col = 'rgb(' + (P.r | 0) + ',' + (P.g | 0) + ',' + (P.b | 0) + ')';
    let cols = [col, col];
    if (mode === 'glitch') cols = gcols;
    else if (mode === 'dance') { cols = [danceCol(f.t * 1.7), danceCol(f.t * 1.7 + 2)]; col = cols[0]; }
    if (P.ban > .5 && talking && f.amp > .55) { col = '#38BDF8'; cols = [col, col]; }   // Banguela falando forte: azul Alfa

    oc.setTransform(dpr, 0, 0, dpr, 0, 0);
    oc.globalCompositeOperation = 'source-over';
    oc.globalAlpha = 1;
    oc.clearRect(0, 0, W, H);
    oc.lineCap = 'round';

    let rcx = 0, rcy = 0, lcx = 0;
    for (let i = 0; i < 2; i++) {
      const s = i ? 1 : -1;
      const el = P.g5 * Math.sin(f.ts * .015);   // Gear 5: estica e achata como borracha
      const w = eyeW * P.sx * (1 + f.pulse) * (1 + el * .12);
      const h = eyeH * P.sy * (1 + f.pulse) * Math.max(f.open, .04) * (1 - el * .16);
      const cx = W / 2 + s * (eyeW / 2 + gap / 2) + P.lx * eyeW * .45 + (f.shake + f.jit) * eyeW + gX + saccX;
      const cy = cyy + P.ly * eyeH * .3 + (f.bob + P.dy) * eyeH + gY + saccY;
      const lid = i ? P.lidR : P.lidL, hap = i ? P.hapR : P.hapL, ang = i ? P.angR : P.angL;
      if (i) { rcx = cx; rcy = cy; } else lcx = cx;

      // olho
      oc.globalCompositeOperation = 'source-over';
      oc.fillStyle = oc.strokeStyle = cols[i];
      oc.globalAlpha = (1 - P.xx) * (1 - P.slp) * f.alpha;
      oc.beginPath();
      oc.roundRect(cx - w / 2, cy - h / 2, w, h, Math.min(w * .42, h / 2));
      oc.fill();

      // cortes: pálpebra, raiva, arco feliz e a cicatriz digital no olho direito
      oc.globalCompositeOperation = 'destination-out';
      oc.globalAlpha = 1;
      oc.fillStyle = oc.strokeStyle = '#000';
      if (lid > .01) oc.fillRect(cx - w, cy - h / 2 - 2, w * 2, h * lid + 2);
      if (ang > .01) {
        const ox = cx + s * (w / 2 + 6), ix = cx - s * (w / 2 + 6), top = cy - h / 2 - 6;
        oc.beginPath();
        oc.moveTo(ox, top); oc.lineTo(ix, top);
        oc.lineTo(ix, top + 6 + h * .62 * ang);
        oc.lineTo(ox, top + 6 + h * .05 * ang);
        oc.closePath(); oc.fill();
      }
      if (hap > .01) {
        const rr = w * .85, topY = cy + h / 2 - Math.min(hap, .95) * h * .62;
        oc.beginPath(); oc.arc(cx, topY + rr, rr, 0, Math.PI * 2); oc.fill();
      }
      if (P.ban > .01) {   // pupila reptiliana: larga e redonda, vira fenda em angry/scanning
        oc.globalAlpha = P.ban;
        oc.beginPath(); oc.ellipse(cx + P.lx * w * .1, cy, w * (.3 - .24 * P.slit), h * (.32 + .1 * P.slit), 0, 0, 6.2832); oc.fill();
        oc.globalAlpha = 1;
      }
      if (i && P.ast > .01) { oc.globalAlpha = P.ast; star(oc, cx, cy, w * .46); oc.globalAlpha = 1; }   // estrela negra de 4 pontas
      if (i) {
        oc.lineWidth = Math.max(2, eyeW * .05);
        oc.beginPath(); oc.moveTo(cx + w * .55, cy - h * .02); oc.lineTo(cx + w * .08, cy - h * .62); oc.stroke();
      }

      // detalhes: X, chifres, lágrimas de pixel, faíscas de fúria
      oc.globalCompositeOperation = 'source-over';
      oc.fillStyle = oc.strokeStyle = cols[i];
      const A = f.alpha;
      if (P.g5 > .01) {   // contorno prata
        oc.globalAlpha = P.g5 * A; oc.strokeStyle = '#C7CDD6'; oc.lineWidth = Math.max(2, eyeW * .035);
        oc.beginPath(); oc.roundRect(cx - w / 2, cy - h / 2, w, h, Math.min(w * .42, h / 2)); oc.stroke(); oc.strokeStyle = cols[i];
      }
      if (P.xx > .01) {
        const d = w * .32;
        oc.globalAlpha = P.xx * A; oc.lineWidth = eyeW * .09;
        oc.beginPath();
        oc.moveTo(cx - d, cy - d); oc.lineTo(cx + d, cy + d);
        oc.moveTo(cx + d, cy - d); oc.lineTo(cx - d, cy + d);
        oc.stroke();
      }
      if (P.slp > .01) {   // olho fechado em arco suave (dormindo)
        oc.globalAlpha = P.slp * A; oc.lineWidth = Math.max(3, eyeW * .09);
        oc.beginPath();
        oc.moveTo(cx - w * .46, cy - h * .05);
        oc.quadraticCurveTo(cx, cy + h * .2, cx + w * .46, cy - h * .05);
        oc.stroke();
      }
      if (P.horns > .01) {
        oc.globalAlpha = P.horns * A; oc.lineWidth = eyeW * .07;
        oc.beginPath();
        oc.moveTo(cx - s * w * .55, cy - h * .55);
        oc.quadraticCurveTo(cx, cy - h * .7, cx + s * w * .9, cy - h * 1.05);
        oc.stroke();
      }
      if (P.tears > .01) {
        oc.globalAlpha = P.tears * A; oc.lineWidth = eyeW * .05;
        for (let q = 0; q < 3; q++) {
          const x = cx + (q - 1) * w * .3, ln = h * (.25 + .55 * ((f.t * .7 + q * .37 + i * .2) % 1));
          oc.beginPath(); oc.moveTo(x, cy + h / 2); oc.lineTo(x, cy + h / 2 + ln); oc.stroke();
        }
      }
      if (P.fury > .01) {
        oc.globalAlpha = P.fury * A * (.6 + .4 * Math.sin(f.t * 30)); oc.lineWidth = eyeW * .05;
        oc.beginPath();
        oc.moveTo(cx + s * w * .55, cy - h * .62); oc.lineTo(cx + s * w * .82, cy - h * .85);
        oc.moveTo(cx + s * w * .7, cy - h * .4); oc.lineTo(cx + s * w * .98, cy - h * .48);
        oc.stroke();
      }
    }
    if (P.spark > .01) {   // faísca de 4 pontas no canto
      oc.globalAlpha = P.spark * f.alpha;
      oc.fillStyle = cols[1];
      star(oc, rcx + eyeW * .62, cyy + eyeH * .5, eyeW * .2 * (.85 + .15 * Math.sin(f.t * 4)));
    }
    oc.globalAlpha = 1;

    // composição: aberração cromática (sombras ciano/magenta deslocadas) + brilho neon
    const cw = Math.min(W, eyeW * 5.2) * dpr, ch = Math.min(H, eyeH * 3.4) * dpr;
    const sx = Math.max(0, cv.width / 2 - cw / 2), sy = Math.max(0, cyy * dpr - ch / 2);
    const BIG = 6000, nb = f.gl > .5 ? 5 : 1;
    const sh = [];
    for (let b = 0; b < nb; b++) sh.push(nb > 1 ? (Math.random() - .5) * 18 * dpr : 0);
    const blit = dx => {
      for (let b = 0; b < nb; b++) {
        const by = sy + ch * b / nb, bh = ch / nb;
        ctx.drawImage(off, sx, by, cw, bh, sx + dx + sh[b], by, cw, bh);
      }
    };
    const ab = (2 + f.gl * 5 * Math.random() + (themeId === 'punk' && !ANIME.includes(lockedMode) ? f.amp * 6 : 0)) * dpr;   // punk: aberração na batida da voz

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, cv.width, cv.height);
    drawBackdrop(f, eyeW, eyeH, cyy);   // clima, relógio e efeitos da armadura
    if (P.rain > .02) drawRain(f);   // chuva de 0 e 1 no fundo (modo hacker)

    ctx.globalCompositeOperation = 'lighter';
    const gm = (batLow ? .5 : 1) * THEME.glow, breath = mode === 'idle' ? 1 + .18 * Math.sin(f.ts * .003) : 1;
    ctx.shadowBlur = 6 * dpr * gm;
    ctx.shadowColor = THEME.b; ctx.shadowOffsetX = BIG - ab; blit(-BIG);
    ctx.shadowColor = THEME.a; ctx.shadowOffsetX = BIG + ab; blit(-BIG);

    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowColor = (isCommunist && mode === 'idle') ? '#FFD700' : col; ctx.shadowBlur = (26 + P.glow * 44) * dpr * gm * breath; ctx.shadowOffsetX = 0;
    blit(0);
    ctx.shadowBlur = 0;
    drawFx(f, { eyeW, eyeH, cyy, rcx, rcy, lcx });
    drawWave(f, col, eyeW, eyeH, cyy);
    if (isCommunist) drawCommunist(f, eyeW, eyeH, cyy);
  }

  /* ---------- Efeitos dos modos ---------- */
  const DANCE_C = [[255, 0, 255], [182, 255, 0], [0, 255, 255], [255, 255, 0]];   // magenta, verde ácido, ciano, amarelo
  function danceCol(pos) {
    const n = DANCE_C.length, fl = Math.floor(pos), a = DANCE_C[fl % n], b = DANCE_C[(fl + 1) % n];
    let u = pos - fl; u = u < .6 ? 0 : (u - .6) / .4; u = u * u * (3 - 2 * u);
    return 'rgb(' + ((a[0] + (b[0] - a[0]) * u) | 0) + ',' + ((a[1] + (b[1] - a[1]) * u) | 0) + ',' + ((a[2] + (b[2] - a[2]) * u) | 0) + ')';
  }

  let rainCols = [], rainFs = 0;
  function drawRain(f) {   // caracteres "0" e "1" caindo no fundo preto
    const fs = Math.max(12, Math.round(Math.min(W, H) / 22)), n = Math.ceil(W / fs);
    if (rainFs !== fs || rainCols.length !== n) {
      rainFs = fs;
      rainCols = Array.from({ length: n }, () => ({ y: -rand(0, H), v: rand(140, 340), len: 8 + ((Math.random() * 12) | 0), ch: Array.from({ length: 20 }, () => Math.random() < .5 ? '0' : '1') }));
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.shadowBlur = 0;
    ctx.font = 'bold ' + fs + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    for (let i = 0; i < n; i++) {
      const d = rainCols[i], x = i * fs + fs / 2;
      d.y += d.v * f.dt;
      if (d.y - d.len * fs > H) { d.y = -rand(0, H * .6); d.v = rand(140, 340); d.len = 8 + ((Math.random() * 12) | 0); }
      for (let k = 0; k < d.len; k++) {
        const y = d.y - k * fs;
        if (y < -fs || y > H) continue;
        if (Math.random() < .03) d.ch[k] = Math.random() < .5 ? '0' : '1';
        const a = P.rain * (k === 0 ? .95 : .55 * (1 - k / d.len));
        ctx.fillStyle = k === 0 ? 'rgba(190,255,205,' + a + ')' : 'rgba(0,255,65,' + a + ')';
        ctx.fillText(d.ch[k], x, y);
      }
    }
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ---------- Fundo vivo: clima, relógio e efeitos das armaduras ---------- */
  let lastWeatherData = null;
  const RAIN_CODES = c => (c >= 51 && c <= 67) || (c >= 80 && c <= 82) || c >= 95;
  function weatherKind() {
    const w = lastWeatherData, h = new Date().getHours();
    if (w && ((w.rain !== null && w.rain >= 50) || (w.code !== null && RAIN_CODES(w.code)) || w.precip > 0)) return 'rain';
    if (w && w.temp >= 27 && h >= 6 && h < 18) return 'heat';
    if (h < 5 || h >= 19) return 'stars';
    return '';
  }
  const wp = Array.from({ length: 44 }, () => ({ x: Math.random(), y: Math.random(), v: rand(.5, 1.1), s: Math.random(), ph: rand(0, 6.28) }));
  const trail = [];   // Sandevistan: últimas 4 posições dos olhos
  let brk = 0;        // Stark: fechamento dos colchetes de mira

  function drawBackdrop(f, eyeW, eyeH, cyy) {
    const t = f.t, dt = f.dt, anime = ANIME.includes(lockedMode), ca = hex(THEME.a);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over'; ctx.shadowBlur = 0; ctx.lineCap = 'round';
    const wk = weatherKind(), nw = wk === 'rain' ? 40 : wk === 'heat' ? 30 : wk === 'stars' ? 44 : 0;
    for (let i = 0; i < nw; i++) {
      const p = wp[i], x = p.x * W;
      if (wk === 'rain') {
        p.y += p.v * dt * .9; if (p.y > 1.05) { p.y = -.05; p.x = Math.random(); }
        ctx.globalAlpha = .12 + .12 * p.s; ctx.strokeStyle = THEME.b; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(x, p.y * H); ctx.lineTo(x - 1, p.y * H + 10 + p.s * 14); ctx.stroke();
      } else if (wk === 'heat') {
        p.y -= p.v * dt * .035; if (p.y < -.05) { p.y = 1.05; p.x = Math.random(); }
        ctx.globalAlpha = .06 + .22 * (.5 + .5 * Math.sin(p.ph + t * .9)); ctx.fillStyle = '#FACC15';
        ctx.beginPath(); ctx.arc(x + Math.sin(t * .5 + p.ph) * 6, p.y * H, 1 + p.s * 1.6, 0, 6.2832); ctx.fill();
      } else {
        ctx.globalAlpha = .06 + .36 * (.5 + .5 * Math.sin(t * .7 + p.ph * 3)); ctx.fillStyle = '#FFFFFF';
        ctx.beginPath(); ctx.arc(x, p.y * H, .7 + p.s * 1.1, 0, 6.2832); ctx.fill();
      }
    }
    const d = new Date(), tx = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0') + (lastWeatherData ? ' • ' + Math.round(lastWeatherData.temp) + '°C' : '');
    ctx.globalAlpha = 1; ctx.font = 'bold ' + Math.max(18, Math.min(W * .085, H * .06)) + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = 'rgba(' + ca.join(',') + ',0.14)';
    ctx.fillText(tx, W / 2, H * .17);   // relógio + temperatura: marca d'água holográfica

    if (!anime) {
      if (themeId === 'stark') {   // Reator Arc: dois anéis segmentados em direções opostas
        const cx = W / 2 + gX * .4, cy = cyy + gY * .4;
        const ring = (r, n, rot, c, al, lw) => { ctx.strokeStyle = c; ctx.globalAlpha = al; ctx.lineWidth = lw; const st = 6.2832 / n; for (let k = 0; k < n; k++) { ctx.beginPath(); ctx.arc(cx, cy, r, rot + k * st, rot + k * st + st * .68); ctx.stroke(); } };
        ring(eyeW * 1.42, 10, t * .6, THEME.a, .3, Math.max(2, eyeW * .045));
        ring(eyeW * 1.1, 8, -t * .9, THEME.b, .34, Math.max(1.5, eyeW * .03));
        ctx.globalAlpha = .05; ctx.fillStyle = THEME.a; ctx.beginPath(); ctx.arc(cx, cy, eyeW * .6, 0, 6.2832); ctx.fill();
      } else if (themeId === 'stealth') {   // pulso de sonar a cada 4 s
        const u = (t % 4) / 4;
        ctx.globalAlpha = (1 - u) * .22; ctx.strokeStyle = THEME.b; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.arc(W / 2, H / 2, (1 - (1 - u) * (1 - u)) * Math.max(W, H) * .6, 0, 6.2832); ctx.stroke();
      }
      if (themeId === 'edgerunner') {   // rastro Sandevistan
        const cur = { x: P.lx * eyeW * .45 + gX + saccX, y: P.ly * eyeH * .3 + gY + saccY, t }, lp = trail[trail.length - 1];
        if (!lp || (t - lp.t > .06 && Math.hypot(cur.x - lp.x, cur.y - lp.y) > 5)) { trail.push(cur); if (trail.length > 4) trail.shift(); }
        const w = eyeW * P.sx, h = eyeH * P.sy * Math.max(f.open, .04);
        trail.forEach((gh, k) => {
          const al = Math.max(0, .26 * (1 - (t - gh.t) / .8)) * (k + 1) / 4;
          if (al < .01) return;
          ctx.globalAlpha = al; ctx.fillStyle = k % 2 ? '#39FF14' : '#00F0FF';
          for (const s of [-1, 1]) { ctx.beginPath(); ctx.roundRect(W / 2 + s * (eyeW * .85) + gh.x - w / 2, cyy + gh.y + (P.dy + f.bob) * eyeH - h / 2, w, h, Math.min(w * .42, h / 2)); ctx.fill(); }
        });
      } else trail.length = 0;
    }
    ctx.globalAlpha = 1; ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* partículas genéricas (faíscas, estrelas, brasas) */
  const pts = [];
  function emit(o) { if (pts.length < 140) pts.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, age: 0, life: 1, r: 2, c: '#fff', k: 'dot' }, o)); }
  function circ(x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); }
  function stepPts(f) {
    for (let i = pts.length - 1; i >= 0; i--) {

      if (p.age >= p.life) { pts.splice(i, 1); continue; }
      p.vy += p.g * f.dt; p.x += p.vx * f.dt; p.y += p.vy * f.dt;

      else { ctx.fillStyle = p.c; circ(p.x, p.y, p.r * (1 - u * .4)); }

  }

  function drawThemeFx(f, g) {
    const { eyeW, eyeH, cyy, rcx, rcy } = g;
    if (ANIME.includes(lockedMode)) return;
    if (themeId === 'punk' && Math.random() < f.dt * .9) {   // micro-faíscas saindo da cicatriz digital
      for (let n = 0, m = 2 + ((Math.random() * 3) | 0); n < m; n++) emit({ x: rcx + eyeW * .3, y: rcy - eyeH * .3, vx: rand(-60, 60), vy: -rand(20, 90), g: 220, life: rand(.25, .5), r: rand(1, 2), c: Math.random() < .5 ? '#00F0FF' : '#FF2BD6' });

      const bx = eyeW * 1.78 - brk * eyeW * .14, hh = eyeH * .62, arm = eyeW * .16;

        ctx.globalAlpha = .75 * f.alpha; ctx.strokeStyle = THEME.a;

        ctx.strokeStyle = THEME.b; ctx.beginPath(); ctx.moveTo(x, cyy); ctx.lineTo(x - s * arm * .6, cyy); ctx.stroke();

  let nextHaki = 2, hakiUntil = 0, nextSlash = 2, slashT = -9, slashFlip = 1;
  function drawAnime(f, g) {
    const { eyeW, eyeH, cyy, rcx, rcy, lcx } = g, t = f.t;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    if (P.ban > .5 && (mode === 'angry' || mode === 'evil' || (talking && f.amp > .5)) && Math.random() < f.dt * 28) {   // faíscas de plasma
      emit({ x: W / 2 + rand(-1.5, 1.5) * eyeW, y: cyy + rand(-.6, .8) * eyeH, vx: rand(-25, 25), vy: -rand(20, 70), life: rand(.9, 1.6), r: rand(1.5, 3.5), c: Math.random() < .5 ? '#A855F7' : '#38BDF8' });
    }
    if (P.g5 > .5) {
      if (Math.random() < f.dt * 1.6) emit({ k: 'star', x: Math.random() < .5 ? rand(.05, .16) * W : rand(.84, .95) * W, y: Math.random() < .5 ? H * .3 : H * .78, vx: rand(-40, 40), vy: -rand(170, 260), g: 460, life: 1.1, r: rand(6, 10), c: Math.random() < .5 ? '#FFFFFF' : '#FDE68A' });
      ctx.globalAlpha = 1; ctx.fillStyle = 'rgba(255,255,255,' + (.2 * P.g5) + ')';   // vapor no topo do visor
      for (let k = 0; k < 7; k++) {
        const bx = ((k * W / 6 + t * 16) % (W + 160)) - 80, by = H * .018 + Math.sin(t * .8 + k) * H * .006, rr = eyeW * .26 * (.85 + .15 * Math.sin(t * 1.3 + k * 2));
        circ(bx - rr, by, rr * .8); circ(bx, by - rr * .3, rr * 1.1); circ(bx + rr, by, rr * .8);
      }
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = Math.max(2, eyeW * .04); ctx.globalAlpha = .9 * P.g5 * f.alpha;   // sobrancelhas em espiral
      [lcx, rcx].forEach((x, i) => {
        const y = rcy - eyeH * .5 * Math.max(P.sy, .6) - eyeW * .3 + Math.sin(t * 3 + i * 2) * eyeW * .05, r = eyeW * .17, rot = t * (i ? 3 : -3);
        ctx.beginPath();
        for (let a = 0; a <= 12.5; a += .3) { const rr = r * a / 12.5, px = x + Math.cos(a + rot) * rr, py = y + Math.sin(a + rot) * rr; a ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
        ctx.stroke();
      });
      if (t > nextHaki) { hakiUntil = t + .14; nextHaki = t + rand(2.5, 5); }
      if (t < hakiUntil) {   // raio de Haki: vermelho com núcleo preto
        const x0 = Math.random() < .5 ? 0 : W, y0 = rand(0, H * .3);
        ctx.beginPath(); ctx.moveTo(x0, y0);
        for (let k = 1; k <= 7; k++) ctx.lineTo(x0 + (W / 2 - x0) * k / 7 * .8 + rand(-18, 18), y0 + (cyy - y0) * k / 7 + rand(-18, 18));
        ctx.globalAlpha = 1; ctx.strokeStyle = '#EF4444'; ctx.shadowColor = '#EF4444'; ctx.shadowBlur = 10 * dpr; ctx.lineWidth = 5; ctx.stroke();
        ctx.shadowBlur = 0; ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.stroke();
      }
    }
    if (P.ast > .01) {
      if (P.ast > .5 && Math.random() < f.dt * 22) emit({ k: 'ember', x: rand(0, W), y: H + 6, vx: rand(-15, 15), vy: -rand(60, 150), life: rand(1.6, 2.8), r: rand(2, 5) });   // Antimagia subindo
      const u = Math.min(W, H) * .1, ax = W - u * 2.3, ay = u * 3.3 + 28, fl = .75 + .25 * Math.sin(t * 9) + (Math.random() - .5) * .08;
      ctx.save(); ctx.globalAlpha = P.ast * fl * f.alpha; ctx.fillStyle = '#0a0005'; ctx.strokeStyle = '#EF4444'; ctx.lineWidth = 2.2; ctx.shadowColor = '#EF4444'; ctx.shadowBlur = 14 * dpr;
      ctx.beginPath(); ctx.moveTo(ax, ay);   // chifre/asa de energia no canto superior direito
      ctx.quadraticCurveTo(ax + u * .2, ay - u * 1.6, ax + u * 1.5, ay - u * 2.9);
      ctx.quadraticCurveTo(ax + u * 1.0, ay - u * 1.4, ax + u * 2.0, ay - u * 1.7);
      ctx.quadraticCurveTo(ax + u * 1.2, ay - u * .7, ax + u * 2.1, ay - u * .5);
      ctx.quadraticCurveTo(ax + u * .9, ay + u * .1, ax + u * .3, ay + u * .5);
      ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();

        if (t > nextSlash) { slashT = t; nextSlash = t + rand(2.2, 4.5); slashFlip = Math.random() < .5 ? 1 : -1; }
        const age = t - slashT;
        if (age < .18) {
          const p = age / .18, xa = slashFlip > 0 ? -20 : W + 20, xb = slashFlip > 0 ? W + 20 : -20, q = Math.min(1, p * 2.2);

        }

    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  }

  const smoke = []; let smokeAcc = 0;
  function drawFx(f, g) {
    const { eyeW, eyeH, cyy, rcx, rcy } = g;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

    // MODO FOCO: anel fino girando ao redor do olho direito
    if (P.ring > .01) {
      const rr = eyeW * .8 * (1 + f.pulse), ang = f.t * 1.9;
      ctx.strokeStyle = '#93C5FD'; ctx.shadowColor = '#3B82F6'; ctx.shadowBlur = 12 * dpr;

      for (let s = 0; s < 3; s++) { const a0 = ang + s * 2.0944; ctx.beginPath(); ctx.arc(rcx, rcy, rr, a0, a0 + 1.45); ctx.stroke(); }
      ctx.globalAlpha = P.ring * f.alpha * .25; ctx.lineWidth = Math.max(1, eyeW * .012);

    if (P.joint > .3 && mode === 'gamer') {
      smokeAcc += f.dt * 24;
      while (smokeAcc >= 1) {
        smokeAcc -= 1;
        if (smoke.length < 90) smoke.push({ x0: ex + rand(-1, 1), y0: ey - th * .4, age: 0, life: rand(2.4, 3.6), ph: rand(0, 6.28), s: rand(.7, 1.1) });
      }
    }
    if (P.joint > .01) {
      ctx.save();
      ctx.translate(bx, by); ctx.rotate(ang);
      ctx.globalAlpha = P.joint * f.alpha;
      ctx.fillStyle = '#EFE8D8';
      ctx.beginPath(); ctx.roundRect(-L / 2, -th / 2, L, th, th * .45); ctx.fill();
      ctx.fillStyle = '#C8A46A';
      ctx.beginPath(); ctx.roundRect(-L / 2, -th / 2, L * .2, th, th * .45); ctx.fill();
      ctx.fillStyle = '#6B6B6B';
      ctx.fillRect(L / 2 - L * .1, -th / 2, L * .08, th);
      const pu = Math.max(.35, .7 + .3 * Math.sin(f.t * 5.5) + (Math.random() - .5) * .08);
      const gr = ctx.createRadialGradient(L / 2, 0, 0, L / 2, 0, th * 1.7);
      gr.addColorStop(0, 'rgba(255,214,120,' + (.95 * pu) + ')');

      gr.addColorStop(1, 'rgba(255,60,0,0)');

      const u = p.age / p.life;
      const x = p.x0 + Math.sin(p.age * 4 + p.ph) * eyeW * .075 * (.35 + u * 1.2);   // zigue-zague
      const y = p.y0 - p.age * eyeH * .3;

      ctx.fillStyle = '#8B5CF6'; ctx.shadowColor = '#6D28D9'; ctx.shadowBlur = 10 * dpr;

      for (let k = 0; k < 9; k++) {

  let HS_PATH = null;   // símbolo ☭ (foice e martelo) como Path2D; null se o navegador não suportar
  try { HS_PATH = new Path2D('M1000 1495Q1237 1495 1446 1306Q1596 1151 1596 936Q1596 735 1471 597L1665 449L1525 318H1522L1337 488Q1172 378 955 378Q785 378 642 466V463L382 0H379Q175 141 171 148Q197 173 542 581Q566 610 573 610Q686 525 844 525Q1035 525 1186 629L969 827L861 712H855Q668 828 659 840L892 1098Q1175 1084 1175 1079L1049 920Q1279 745 1308 731V733Q1374 823 1374 947V983Q1374 1237 1123 1338Q986 1407 867 1407H830Q732 1407 612 1352Q782 1495 1000 1495Z'); } catch (e) {}

  function star5(c, x, y, R) {   // estrela de 5 pontas (só o caminho)
    c.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 ? R * .42 : R;

    }
    c.closePath();
  }

  // MODO COMUNISTA: boina vermelha com estrela sobre os olhos + foice e martelo dourados flutuando
  function drawCommunist(f, eyeW, eyeH, cyy) {
    const u = eyeW, A = f.alpha * (1 - P.slp * .6) * (1 - P.xx * .5);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.shadowBlur = 0;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    // boina inclinada no topo dos olhos
    const topY = cyy + (P.dy + f.bob) * eyeH + gY - eyeH * .5 * Math.max(P.sy, .9) * (1 + f.pulse) + eyeH * .06;
    const bw = u * 1.2, bh = u * .44;
    ctx.save();
    ctx.translate(W / 2 + gX - u * .12, topY);
    ctx.rotate(-.2);
    ctx.globalAlpha = A;
    ctx.lineWidth = Math.max(2, u * .035); ctx.strokeStyle = '#2B0A10';

    ctx.fillStyle = '#B10321';

    ctx.fillStyle = '#FFD700'; ctx.lineWidth = Math.max(1.5, u * .02);

    ctx.restore();

    // foice e martelo (contorno real do símbolo ☭) no canto superior direito, flutuando suavemente
    if (HS_PATH) {
      const sz = u * .6, k = sz / 1495;
      const ex = Math.min(W - sz * .6, W / 2 + u * 1.55) + gX * .5, ey = cyy - eyeH * .98 + Math.sin(f.t * 1.3) * u * .04 + gY * .5;

  // onda sonora neon logo abaixo dos olhos: volume real (AnalyserNode) ou simulada no fallback
  function drawWave(f, col, eyeW, eyeH, cyy) {
    for (let i = 0; i < WN; i++) {
      let tg = 0;
      if (f.wm === 1 && abuf) tg = Math.max(-1, Math.min(1, ((abuf[(i * (abuf.length - 1) / (WN - 1)) | 0] - 128) / 128) * 3.2));
      else if (f.wm === 2) tg = Math.sin(i * .85 + f.t * 24) * f.amp * (.6 + .4 * Math.sin(i * .31 - f.t * 9));
      wv[i] += (tg - wv[i]) * (f.wm ? .55 : .2);
    }
    const ww = Math.min(W * .72, eyeW * 4.4), x0 = (W - ww) / 2;
    const y = Math.min(cyy + eyeH * .85, H - 125), ampPx = eyeH * .2;
    const lev = f.wm ? Math.min(1, f.amp * 1.2) : 0;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = (.28 + .72 * lev) * f.alpha * (1 - P.xx * .7);
    ctx.strokeStyle = col; ctx.shadowColor = col; ctx.shadowBlur = 10 * dpr * THEME.glow;
    ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    for (let i = 0; i < WN; i++) {
      const x = x0 + ww * i / (WN - 1), env = Math.sin(Math.PI * i / (WN - 1));
      const yy = y + wv[i] * ampPx * env;
      if (i) ctx.lineTo(x, yy); else ctx.moveTo(x, yy);
    }
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x0, y - 4); ctx.lineTo(x0, y + 4);
    ctx.moveTo(x0 + ww, y - 4); ctx.lineTo(x0 + ww, y + 4);
    ctx.stroke();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  /* ---------- Avisos ---------- */
  const noticeEl = document.getElementById('notice');

  /* ---------- Visão: câmera traseira ---------- */
  const camVideo = document.getElementById('camVideo');
  const camCanvas = document.getElementById('camCanvas');
  const flashEl = document.getElementById('flash');
  let defaultCamera = 'environment';   // 'environment' = traseira, 'user' = frontal
  let camState = '', camWarnUntil = 0;   // HUD: '' | 'ATIVA' | 'FALHOU'

  function playShutter() {   // clique de obturador: dois estalos curtos de ruído filtrado
    if (!actx) return;
    try {
      if (actx.state === 'suspended') actx.resume().catch(() => {});
      [0, .07].forEach((d, i) => {
        const t0 = actx.currentTime + d, len = i ? .09 : .05;
        const buf = actx.createBuffer(1, Math.ceil(actx.sampleRate * len), actx.sampleRate), ch = buf.getChannelData(0);
        for (let k = 0; k < ch.length; k++) ch[k] = (Math.random() * 2 - 1) * Math.pow(1 - k / ch.length, 2);
        const src = actx.createBufferSource(), fl = actx.createBiquadFilter(), g = actx.createGain();
        src.buffer = buf; fl.type = 'bandpass'; fl.frequency.value = i ? 1800 : 3200; fl.Q.value = .8;
        g.gain.setValueAtTime(.55, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + len);
        src.connect(fl); fl.connect(g); g.connect(actx.destination);
        src.start(t0); src.stop(t0 + len + .02);
      });
    } catch (e) {}
  }

  function triggerCameraSnap() {   // flash + som de obturador + olhos em 'scanning'
    setMode('scanning');
    playShutter();
    flashEl.classList.add('snap');
    requestAnimationFrame(() => requestAnimationFrame(() => flashEl.classList.remove('snap')));
    try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
  }

  async function captureRearCameraFrame(forceFacing = null) {
    let stream = null;
    camState = 'ATIVA'; renderHud();
    setMode('scanning');
    try {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('sem câmera');
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: forceFacing || defaultCamera }, width: { ideal: 640 } }, audio: false });
      camVideo.srcObject = stream;
      try { await camVideo.play(); } catch (e) {}
      const t0 = Date.now();
      while ((camVideo.readyState < 2 || !camVideo.videoWidth) && Date.now() - t0 < 5000) await new Promise(r => setTimeout(r, 50));
      if (!camVideo.videoWidth) throw new Error('sem frame');
      await new Promise(r => setTimeout(r, 350));   // deixa o auto-exposição estabilizar
      triggerCameraSnap();
      const vw = camVideo.videoWidth, vh = camVideo.videoHeight, sc = Math.min(1, 512 / vw);
      camCanvas.width = Math.round(vw * sc); camCanvas.height = Math.round(vh * sc);
      camCanvas.getContext('2d').drawImage(camVideo, 0, 0, camCanvas.width, camCanvas.height);
      const url = camCanvas.toDataURL('image/jpeg', 0.72);
      camState = '';
      return url;
    } catch (e) {
      camState = 'FALHOU'; camWarnUntil = Date.now() + 6000;
      return null;
    } finally {
      if (stream) stream.getTracks().forEach(t => t.stop());   // desliga a câmera na hora
      try { camVideo.srcObject = null; } catch (e) {}
      if (camState === 'ATIVA') camState = '';
      renderHud();
    }
  }

  /* ---------- Fala e reconhecimento ---------- */
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const hasTTS = 'speechSynthesis' in window;
  let rec = null, phase = 'idle', session = 0;
  let holdTimer = 0, fallbackTimer = 0;
  let autoOn = false, followUntil = 0, awakeTimer = 0;
  let ttsCtl = null, curUrl = null, kickTimer = 0;
  let voice = null;

  let voices = [];
  function pickVoice() {
    if (!hasTTS) return;
    const vs = speechSynthesis.getVoices();
    const nice = /google|natural|online/i;
    const score = v => (/^pt[-_]BR$/i.test(v.lang) ? 2 : 0) + (nice.test(v.name) ? 1 : 0);
    voices = vs.filter(v => /^pt/i.test(v.lang)).sort((a, b) => score(b) - score(a));
    let saved = null;
    try { saved = localStorage.getItem('voz'); } catch (e) {}
    voice = voices.find(v => v.name === saved) || voices[0] || null;
  }
  if (hasTTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }

  // volta ao repouso: se houver modo travado (ou hacker/dormir ativo), retorna a ele em vez de 'idle'
  function goIdle() { phase = 'idle'; talking = false; setMode(restMode()); scheduleResume(); }

  function stopAll() {
    session++;
    pendingSleep = false;
    clearTimeout(holdTimer); clearTimeout(fallbackTimer); clearTimeout(awakeTimer);
    clearInterval(kickTimer);
    if (ttsCtl) { try { ttsCtl.abort(); } catch (e) {} ttsCtl = null; }
    releaseAudio();
    if (ctl) { try { ctl.abort(); } catch (e) {} ctl = null; }
    const r = rec; rec = null;
    if (r) { try { r.abort(); } catch (e) {} }
    if (hasTTS) speechSynthesis.cancel();
    talking = false;
  }

  function manual(m) {
    stopAll();
    clearHack(); lockedMode = null; applyRate();   // expressão manual assume o controle e destrava o modo
    if (isSleeping) leaveSleep();
    syncToggles();
    phase = 'manual';
    talking = false;
    setMode(m);
    caption('');
  }

  function startListening() {
    if (!SR) { notify('Este navegador não suporta reconhecimento de voz.', 6000); return; }
    stopAll();
    const sid = session;
    const r = new SR();
    rec = r;
    r.lang = 'pt-BR';
    r.interimResults = true;
    r.continuous = false;
    r.maxAlternatives = 1;

    let heard = '', errored = false;
    phase = 'listening';
    setMode('listening');
    caption('');

    r.onresult = e => {
      if (rec !== r) return;
      let interim = '', fin = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const res = e.results[i];
        if (res.isFinal) fin += res[0].transcript; else interim += res[0].transcript;
      }
      if (fin) heard = fin.trim();
      caption(fin || interim);
    };
    r.onerror = e => {
      if (rec !== r) return;
      errored = true;
      const err = e.error;
      if (err === 'not-allowed' || err === 'service-not-allowed') notify('Microfone bloqueado. Libere a permissão do site no Chrome (use https ou localhost).', 7000);
      else if (err === 'audio-capture') notify('Nenhum microfone encontrado.', 5000);
      else if (err === 'network') notify('O reconhecimento de voz do Chrome precisa de internet.', 6000);
      else if (err === 'no-speech') notify('Não ouvi nada. Toque e fale de novo.');
      else if (err !== 'aborted') notify('Erro de áudio: ' + err);
    };
    r.onend = () => {
      if (rec !== r || sid !== session) return;
      rec = null;
      if (heard) respondTo(heard);
      else { if (!errored) notify('Não ouvi nada. Toque e fale de novo.'); goIdle(); }
    };

    try { r.start(); playBeep('listen'); }
    catch (err) { rec = null; notify('Não foi possível iniciar o microfone.'); goIdle(); }
  }

  async function respondTo(text) {
    const sid = session;
    const forced = detectCmd(text);   // comandos de modo reconhecidos localmente (não dependem da IA)
    playBeep('think');
    phase = 'thinking';
    setMode('thinking');
    caption('“' + text + '”');
    try {
      const [reply] = await Promise.all([askGroq(text), new Promise(r => setTimeout(r, 1000))]);
      if (sid !== session) return;
      const act = forced || reply.act;
      if (act) runAct(act, true);
      speak(reply);
    } catch (err) {
      if (sid !== session) return;
      notify(errorMessage(err), 6000);
      caption('');
      if (forced) runAct(forced, false);
      goIdle();
    }
  }

  function speak(reply) {
    reply = Object.assign({}, reply, { text: String(reply.text || '').replace(/\[[^\]]*\]/g, ' ').replace(/\[[^\]]*$/, '').replace(/\s+/g, ' ').trim() });   // nunca fala nem mostra tags
    const sid = session;
    let finished = false, usedNative = false;
    phase = 'speaking';
    caption(reply.text);

    // olhos vibrando no ritmo da voz: pulso a cada 140 ms
    // cara durante a fala: modo travado/hacker manda; senão vale a emoção da IA
    const faceNow = () => { const b = restMode(); return b !== 'idle' ? b : (reply.face || 'idle'); };
    const startEyes = isLive => {
      setMode(faceNow());
      talking = true;
      clearInterval(kickTimer);
      if (!isLive) kickTimer = setInterval(() => { kick = 1; }, 140);   // com analisador ativo, o volume real manda
    };
    const done = () => {
      if (finished || sid !== session) return;
      finished = true;
      clearTimeout(fallbackTimer);
      clearInterval(kickTimer);
      releaseAudio();               // revokeObjectURL + limpeza do áudio
      talking = false;
      if (pendingSleep) { pendingSleep = false; enterSleep(); return; }   // "vai dormir": dorme depois de falar
      if (restMode() === 'idle' && reply.face && reply.face !== 'idle') { phase = 'hold'; holdTimer = setTimeout(() => { if (sid === session) goIdle(); }, 2200); }
      else goIdle();
    };

    // fallback: voz nativa do navegador
    const useNative = () => {
      if (usedNative || finished || sid !== session) return;
      usedNative = true;
      releaseAudio();
      startEyes();
      if (!hasTTS) { notify('Síntese de voz indisponível neste navegador.'); setTimeout(done, 2000); return; }
      const u = new SpeechSynthesisUtterance(reply.text);
      u.lang = 'pt-BR';
      if (voice) u.voice = voice;
      u.rate = voiceRate();
      u.pitch = 1;
      u.onboundary = () => { kick = 1; };
      u.onend = done;
      u.onerror = done;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
      clearTimeout(fallbackTimer);
      fallbackTimer = setTimeout(() => { speechSynthesis.cancel(); done(); }, 4000 + reply.text.length * 110);
    };

    (async () => {
      const c = new AbortController();
      ttsCtl = c;
      let timedOut = false;
      const to = setTimeout(() => { timedOut = true; c.abort(); }, 12000);
      try {
        const res = await wfetch(FISH_URL, {
          method: 'POST',
          signal: c.signal,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ text: reply.text, format: 'mp3', reference_id: FISH_REF })
        });
        if (!res.ok) { const e = new Error('http'); e.status = res.status; throw e; }
        const blob = await res.blob();
        if (!blob.size) throw new Error('áudio vazio');
        if (sid !== session) return;

        const url = URL.createObjectURL(blob);
        curUrl = url;
        player.onplay = () => {
          if (sid !== session || finished) return;
          live = !!analyser;
          applyRate();
          startEyes(live);
          clearTimeout(fallbackTimer);
          const dur = isFinite(player.duration) && player.duration > 0 ? player.duration : 15;
          fallbackTimer = setTimeout(done, (dur + 3) * 1000);   // segurança caso onended não dispare
        };
        player.onended = () => { done(); };                      // done() libera a URL (revokeObjectURL)
        player.onerror = () => { notify('Voz Fish Audio: não foi possível tocar o áudio. Usando voz nativa.', 6000); useNative(); };
        if (actx && actx.state === 'suspended') {
          try { await Promise.race([actx.resume(), new Promise(r => setTimeout(r, 400))]); } catch (e) {}
          if (sid !== session) return;
        }
        player.crossOrigin = 'anonymous';
        player.src = url;
        applyRate();   // trocar o src reseta a velocidade; reaplica (0.90 no gamer, 1.0 nos outros)
        await player.play();
      } catch (err) {
        if (sid !== session) return;
        const e = timedOut ? Object.assign(new Error('timeout'), { timeout: true }) : err;
        notify('Voz Fish Audio: ' + fishError(e) + '. Usando voz nativa.', 8000);
        useNative();
      } finally {
        clearTimeout(to);
        if (ttsCtl === c) ttsCtl = null;
      }
    })();
  }

  /* ---------- Modo mãos livres (palavra de ativação "Jarvis") ---------- */
  const WAKE_SRC = 'jarvis|jarvi|jarves|jarvez|jarbis|jarvs|garvis|charvis|jarvys';
  const WAKE = new RegExp('\\b(' + WAKE_SRC + ')\\b[,.!?]?\\s*', 'gi');
  const WAKE_TEST = new RegExp('\\b(' + WAKE_SRC + ')\\b');

  /* ---------- Tela sempre acesa (Wake Lock) enquanto o Auto estiver ativo ---------- */
  let wakeLock = null;
  async function acquireWake() {
    if (!autoOn || isSleeping) return;
    try {
      if (!navigator.wakeLock || (wakeLock && !wakeLock.released)) return;
      const wl = await navigator.wakeLock.request('screen');
      wakeLock = wl;
      wl.addEventListener('release', () => { if (wakeLock === wl) wakeLock = null; });
      if (!autoOn) releaseWake();
    } catch (e) { wakeLock = null; }
  }
  function releaseWake() {
    try { if (wakeLock) wakeLock.release(); } catch (e) {}
    wakeLock = null;
  }

  function scheduleResume() {
    if (!autoOn) return;
    followUntil = 0;   // Auto: só responde quando ouvir "Jarvis"
    setTimeout(() => { if (autoOn && phase === 'idle' && !rec) startPassive(); }, 400);
  }

  function stopAuto() {
    autoOn = false;
    releaseWake();
    autoBtn.classList.remove('on');
    stopAll();
    goIdle();
  }

  function onAutoUtterance(raw) {
    const s = raw.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    const woke = WAKE_TEST.test(s);
    if (isSleeping) {   // dormindo: ignora tudo, exceto "jarvis" + acorda/acordar/bom dia
      if (woke && /\b(acorda|acordar|bom dia)\b/.test(s)) { wakeUp(); return true; }
      return false;
    }
    if (!woke && Date.now() >= followUntil) return false;   // ignora conversa alheia
    const text = raw.replace(WAKE, '').trim();
    clearTimeout(awakeTimer);
    if (text.length < 2) {                                   // só chamou o nome
      followUntil = Date.now() + 8000;
      setMode('listening');
      playBeep('listen');
      caption('Pode falar…');
      awakeTimer = setTimeout(() => { if (phase === 'passive') { setMode(restMode()); caption(''); } }, 8000);
      return false;
    }
    stopAll();
    respondTo(text);
    return true;
  }

  function startPassive() {
    if (!autoOn || rec) return;
    const sid = session;
    const r = new SR();
    rec = r;
    r.lang = 'pt-BR';
    r.continuous = true;
    r.interimResults = false;
    r.maxAlternatives = 1;
    phase = 'passive';

    clearTimeout(awakeTimer);
    if (Date.now() < followUntil) {
      setMode('listening');
      awakeTimer = setTimeout(() => { if (phase === 'passive') { setMode(restMode()); caption(''); } }, followUntil - Date.now());
    } else setMode(restMode());

    r.onresult = e => {
      if (rec !== r) return;
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (!e.results[i].isFinal) continue;
        if (onAutoUtterance(e.results[i][0].transcript)) return;
      }
    };
    r.onerror = e => {
      if (rec !== r) return;
      const err = e.error;
      if (err === 'not-allowed' || err === 'service-not-allowed') { notify('Microfone bloqueado. Libere a permissão do site no Chrome (use https ou localhost).', 7000); stopAuto(); }
      else if (err === 'audio-capture') { notify('Nenhum microfone encontrado.', 5000); stopAuto(); }
      else if (err === 'network') { notify('O reconhecimento de voz do Chrome precisa de internet.', 6000); stopAuto(); }
      // no-speech / aborted: o onend reinicia sozinho
    };
    r.onend = () => {
      if (rec !== r) return;
      rec = null;
      if (autoOn && phase === 'passive' && sid === session) setTimeout(startPassive, 300);
    };
    try { r.start(); }
    catch (err) { rec = null; setTimeout(() => { if (autoOn && phase === 'passive') startPassive(); }, 1000); }
  }

  const autoBtn = document.createElement('button');
  autoBtn.textContent = 'Auto';
  autoBtn.addEventListener('click', e => {
    e.stopPropagation();
    onFirstTap();
    if (autoOn) { stopAuto(); notify('Mãos livres desligado.', 2500); return; }
    if (!SR) { notify('Este navegador não suporta reconhecimento de voz.', 6000); return; }
    autoOn = true;
    autoBtn.classList.add('on');
    acquireWake();
    stopAll();
    followUntil = 0;
    phase = 'idle';
    startPassive();
    notify('Mãos livres ligado. Diga “Jarvis” e fale.', 5000);
  });
  bar.appendChild(autoBtn);

  /* ---------- Modos especiais: fixos (lockedMode), hacker de 7 s e dormir/acordar ---------- */
  const voiceRate = () => (lockedMode === 'gamer' ? 0.90 : 1.0);   // voz mais lenta só no modo gamer
  function applyRate() { try { player.defaultPlaybackRate = voiceRate(); player.playbackRate = voiceRate(); } catch (e) {} }
  const inTalkFlow = () => phase === 'listening' || phase === 'thinking';   // ao sair deles, goIdle() usa restMode()

  function leaveSleep() { isSleeping = false; acquireWake(); triggerGrumpyWakeUp({ silent: true }); }

  /* ---------- Mau humor de 3 s ao abrir a página e ao sair do sono ---------- */
  function grumpyPhrase() {
    const h = new Date().getHours();
    if (h >= 5 && h < 12) return 'Agh... já me abriram de novo? Nem tomei meu café digital...';
    if (h >= 12 && h < 18) return 'Ugh... justo agora que eu estava na minha soneca da tarde. Fala logo.';
    if (h >= 18) return 'Hmpf... a noite mal começou e já me acordam. Que foi agora?';
    return 'Sério? A essa hora da madrugada? Até os bits estão dormindo... Fala logo.';
  }
  function settleFace() {   // volta a restMode() (idle ou lockedMode) sem atrapalhar conversa em andamento
    if (isSleeping || phase === 'listening' || phase === 'thinking' || phase === 'manual') return;
    if (phase === 'waking') phase = 'idle';
    setMode(restMode());
    syncToggles();
  }
  function triggerGrumpyWakeUp(opts) {
    opts = opts || {};
    clearTimeout(grumpyTimer);
    grumpyUntil = Date.now() + 3000;
    grumpyTimer = setTimeout(() => { grumpyUntil = 0; settleFace(); }, 3000);
    if (phase !== 'listening' && phase !== 'thinking' && phase !== 'manual') setMode('grumpy');
    if (opts.silent) return;
    const msg = { face: 'idle', text: grumpyPhrase() };   // face 'idle': durante os 3 s vale 'grumpy' via restMode()
    if (opts.speakNow && !firstTap) speak(msg);
    else { caption(msg.text); pendingGrumpy = msg; }       // fala no primeiro toque (onFirstTap)
  }

  function lockMode(m) {   // gamer | focus | dance ficam ativos até serem desativados
    clearHack();
    if (isSleeping) leaveSleep();
    const wasLocked = lockedMode;
    lockedMode = m;
    if (ANIME.includes(m) && wasLocked !== m) playAnimeSound(m);
    if (m === 'focus' && wasLocked !== 'focus') startPomodoro(); else if (m !== 'focus') stopPomodoro();   // Modo Foco: Pomodoro de 25 min
    applyRate(); syncToggles();
    if (!inTalkFlow()) setMode(restMode());
  }
  function unlockNormal() {   // [normal]: destrava e volta os olhos para 'idle'
    lockedMode = null;
    stopPomodoro();
    clearHack();
    applyRate(); syncToggles();
    if (!isSleeping && !inTalkFlow()) setMode('idle');
  }

  function clearHack() { hackUntil = 0; clearTimeout(hackTimer); hackTimer = 0; }
  function endHack() {   // fim dos 7 s: volta para lockedMode || 'idle'
    clearHack(); syncToggles();
    if (!isSleeping && !inTalkFlow() && phase !== 'waking') setMode(restMode());
  }
  function startHack() {   // NÃO trava lockedMode: expressão 'hack' por exatamente 7000 ms
    if (isSleeping) leaveSleep();
    clearTimeout(hackTimer);
    hackUntil = Date.now() + 7000;
    hackTimer = setTimeout(endHack, 7000);
    syncToggles();
    if (!inTalkFlow()) setMode('hack');
  }

  function enterSleep() {
    clearHack();
    stopAll();
    lockedMode = null; stopPomodoro(); pendingSleep = false; applyRate();
    isSleeping = true;
    releaseWake();
    followUntil = 0;
    talking = false; caption('');
    phase = 'idle';
    setMode('sleep');
    syncToggles();
    if (autoOn) startPassive();   // continua ouvindo, mas só reage a "jarvis" + acorda/bom dia
  }

  function greeting() {
    const h = new Date().getHours();
    return h >= 5 && h < 12 ? 'Bom dia! Já estou de pé.' : h >= 12 && h < 18 ? 'Boa tarde! Voltei da soneca.' : 'Boa noite! Estou acordado, pode falar.';
  }

  function wakeUp() {
    if (!isSleeping) return;
    isSleeping = false;
    stopAll();
    const sid = session;
    playWakeSound();
    phase = 'waking'; talking = false;
    caption('');
    acquireWake();                   // só reativa se o Auto estiver ligado
    syncToggles();
    triggerGrumpyWakeUp({ speakNow: true });   // 3 s de mau humor + saudação rabugenta falada
    { const h = new Date().getHours(); if (h >= 5 && h < 12) scheduleBriefing(); }   // briefing matinal logo depois
  }

  // comandos de voz reconhecidos localmente (a IA também pode mandar as tags)
  const RE_NORMAL = /\bvolt(?:a|ar|e)\s+(?:ao|pro|pra|para o)\s+normal\b|\bmodo\s+normal\b|\bdesativ(?:a|ar|e)\s+(?:o\s+)?modo\b|\bsa(?:i|ir|ia)\s+do\s+modo\b|\b(?:para|parar|pare|chega)\s+de\s+danc(?:a|ar)\b/;
  const RE_SLEEP = /\bvai\s+dormir\b|\bdormir\b/;
  const RE_HACK = /\bmodo\s+hacker\b|\bhackear\b|\bhackeia\b|\bhackea\b/;
  const RE_GAMER = /\bvamos\s+chapar\b|\bmodo\s+gamer\b|\bmodo\s+proibido\b/;
  const RE_FOCUS = /\bmodo\s+foco\b|\bhora\s+de\s+estudar\b/;
  const RE_DANCE = /\bdanca\b|\bvamos\s+dancar\b|\bmodo\s+discoteca\b|\bfesta\b/;
  const RE_BAN = /\bmodo\s+banguela\b|\bfuria\s+da\s+noite\b|\bmodo\s+dragao\b/;
  const RE_G5 = /\bgear\s*(?:5|cinco)\b|\bmodo\s+luffy\b|\btambores\s+da\s+libertacao\b/;
  const RE_ASTA = /\bmodo\s+asta\b|\bmodo\s+capeta\b|\bantimagia\b|\bblack\s+asta\b/;
  function detectCmd(raw) {
    const s = String(raw).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
    if (RE_NORMAL.test(s)) return 'normal';
    if (RE_SLEEP.test(s)) return 'sleep';
    if (RE_HACK.test(s)) return 'hack';
    if (RE_GAMER.test(s)) return 'gamer';
    if (RE_FOCUS.test(s)) return 'focus';
    if (RE_DANCE.test(s)) return 'dance';
    if (RE_BAN.test(s)) return 'banguela';
    if (RE_G5.test(s)) return 'gear5';
    if (RE_ASTA.test(s)) return 'asta';
    return null;
  }

  function runAct(act, speaking) {
    if (act === 'normal') unlockNormal();
    else if (act === 'gamer' || act === 'focus' || act === 'dance' || ANIME.includes(act)) lockMode(act);
    else if (act === 'hack') startHack();
    else if (act === 'sleep') { if (speaking) pendingSleep = true; else enterSleep(); }
    else if (act === 'wakeup') { if (isSleeping) wakeUp(); }
  }

  function toggleMode(m) {
    if (m === 'sleep') { if (isSleeping) wakeUp(); else enterSleep(); return; }
    if (m === 'hack') { if (hackOn()) endHack(); else startHack(); return; }
    if (lockedMode === m && !isSleeping) unlockNormal(); else lockMode(m);
  }

  /* ---------- Armaduras: troca por botão, voz e tag [theme: ...] ---------- */
  let themeLocal = false;
  function applyTheme(id) {
    if (!THEMES.includes(id)) return;
    setThemeVisual(id);
    try { localStorage.setItem(THEME_KEY, id); } catch (e) {}
    trail.length = 0;
    if (ANIME.includes(lockedMode)) unlockNormal();   // trocar de armadura destrava o modo de anime
    else setMode(mode);
    syncToggles();
  }
  function handleThemeTag(v) {
    v = normTxt(v);
    const i = THEMES.indexOf(themeId); let id = null;
    if (v === 'next') id = THEMES[(i + 1) % 4];
    else if (v === 'prev') id = THEMES[(i + 3) % 4];
    else if (THEMES.includes(v)) id = v;
    else if (/^[1-4]$/.test(v)) id = THEMES[v - 1];
    if (id) applyTheme(id);
  }
  function detectTheme(raw) {   // comandos locais (evita depender só da IA)
    const t = normTxt(raw);
    if (/\b(?:tema|armadura)\s+anterior\b|\bvolt\w*\s+(?:a\s+|o\s+)?(?:armadura|tema)\b/.test(t)) return 'prev';
    if (/\bproxim[ao]\s+(?:tema|armadura)\b|\bmud\w*\s+(?:de\s+)?(?:tema|armadura)\b|\btroc\w*\s+(?:de\s+)?(?:tema|armadura)\b/.test(t)) return 'next';
    if (/\barmadura\s+(?:numero\s+)?(?:1|um)\b|\b(?:tema|armadura)\s+padrao\b/.test(t)) return 'punk';
    if (/\barmadura\s+(?:numero\s+)?(?:2|dois)\b|\bmodo\s+stark\b|\bhomem\s+de\s+ferro\b/.test(t)) return 'stark';
    if (/\barmadura\s+(?:numero\s+)?(?:3|tres)\b|\bedge\s*runner\b/.test(t)) return 'edgerunner';
    if (/\barmadura\s+(?:numero\s+)?(?:4|quatro)\b|\bstealth\b/.test(t)) return 'stealth';
    return null;
  }
  document.getElementById('themeBtn').addEventListener('click', e => {
    e.stopPropagation(); onFirstTap(); handleThemeTag('next');
    notify('Armadura ' + (THEMES.indexOf(themeId) + 1) + ': ' + THEME.n, 1800);
  });

  function setCommunist(v) {   // liga/desliga a camada comunista (não mexe em lockedMode nem nas expressões)
    v = !!v;
    if (v === isCommunist) return;
    isCommunist = v;
    syncToggles();
    setMode(mode);   // reaplica a cor base
  }
